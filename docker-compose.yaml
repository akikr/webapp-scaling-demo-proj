services:
  httpbin-service:
    image: docker.io/mccutchen/go-httpbin:latest
    ports:
      - "8080"
    deploy :
      mode : replicated
      replicas : 1

  webapp-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: webapp-service:v1
    environment:
      - APP_ARGS=--spring.profiles.active=dev --spring.threads.virtual.enabled=true --http-bin.server.url=http://httpbin-service:8080 --management.zipkin.tracing.endpoint=http://zipkin-service:9411/api/v2/spans
      #- JAVA_OPTS=-Xmx300m
    ports:
      - "8090"
    labels:
      - "traefik.enable=true"
      # Route all the requests to 'webapp-service' via web-entrypoint on http port 80
      - "traefik.http.routers.webapp-service.entrypoints=web"
      # Route all the request with path-regex /api/* to this webapp-service
      - "traefik.http.routers.webapp-service.rule=PathPrefix(`/api`)"
      - "traefik.http.services.webapp-service.loadbalancer.server.port=8090"
      # Strip /api prefix before forwarding to the service
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.webapp-service.middlewares=strip-api-prefix"
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: "200M"
        reservations:
          cpus: "1.0"
          memory: "100M"
    depends_on:
      httpbin-service:
        condition: service_started
      zipkin-service:
        condition: service_started

  zipkin-service:
    image: openzipkin/zipkin:latest
    container_name: zipkin-service
    ports:
      - "9411:9411" #Open Zipkin UI: http://localhost:9411
    environment:
      - STORAGE_TYPE=mem
      - LOG_LEVEL=DEBUG

  api-proxy:
    image: traefik:v3.1
    container_name: web-app-proxy
    command:
      # Enables access logging
      - "--log.level=INFO"
      - "--accesslog=true"
      # Do not expose any docker containers unless explicitly told so
      - "--providers.docker.exposedbydefault=false"
      # Enables the web-entrypoint on http port 80
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      httpbin-service:
        condition: service_started
      webapp-service:
        condition: service_started
      zipkin-service:
        condition: service_started
