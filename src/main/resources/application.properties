## spring configs
server.port=8090
spring.application.name=webapp
server.servlet.context-path=/${spring.application.name}
spring.threads.virtual.enabled=true

## spring-actuator config
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

## application server configs
http-bin.server.url=http://httpbin-service:8080

## logging configs
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.webapp.config.RestClientInterceptor=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name}] [%thread] [%X{traceId:-}:%X{spanId:-}] %-5level %logger{36} - %msg%n
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

## rest client logging configs
# Enable/disable rest client logging (Even enabled, set logging level to DEBUG to see the logs)
rest-client.logging.enabled=true
rest-client.logging.include-request-headers=true
rest-client.logging.include-request-body=false
rest-client.logging.include-response-headers=false
rest-client.logging.include-response-body=false
# Max length of request/response body to log. If body length exceeds this value, it will be truncated.
rest-client.logging.max-body-length=100
